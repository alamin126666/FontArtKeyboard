name: Android CI/CD Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x FontsArtKeyboard/gradlew

      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔍 Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: 🏗️ Build Debug APK
        if: github.event.inputs.build_type != 'release'
        working-directory: FontsArtKeyboard
        run: ./gradlew assembleDebug --stacktrace

      - name: 🚀 Build Release APK
        if: github.event.inputs.build_type == 'release'
        working-directory: FontsArtKeyboard
        run: ./gradlew assembleRelease --stacktrace

      - name: 📊 Run Unit Tests
        working-directory: FontsArtKeyboard
        run: ./gradlew test --stacktrace
        continue-on-error: true

      - name: 📤 Upload Debug APK
        if: github.event.inputs.build_type != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: fonts-art-keyboard-debug-${{ github.run_number }}
          path: FontsArtKeyboard/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📤 Upload Release APK
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: fonts-art-keyboard-release-${{ github.run_number }}
          path: FontsArtKeyboard/app/build/outputs/apk/release/*.apk
          retention-days: 90

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x FontsArtKeyboard/gradlew

      - name: 🔎 Run Lint
        working-directory: FontsArtKeyboard
        run: ./gradlew lint --stacktrace
        continue-on-error: true

      - name: 📤 Upload Lint Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results-${{ github.run_number }}
          path: FontsArtKeyboard/app/build/reports/lint-results-debug.html
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x FontsArtKeyboard/gradlew

      - name: 🚀 Build Release APK
        working-directory: FontsArtKeyboard
        run: ./gradlew assembleRelease

      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: FontsArtKeyboard/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          name: "Fonts Art Keyboard ${{ github.ref_name }}"
          body: |
            ## 🎉 Fonts Art Keyboard ${{ github.ref_name }}
            
            ### ✨ Features
            - 50+ Beautiful keyboard themes
            - 15+ Unicode font styles (Bold, Italic, Script, Fraktur...)
            - 1000+ Emoji in categories
            - 150+ Kaomoji
            - Bangla + English keyboard support
            - Text decorators (Zalgo, Bubble, Small Caps, Cursive...)
            - Smart auto-suggestion
            - Clipboard manager
            - Voice typing support
            - Dark/Light theme
            - Key press sound & vibration
            
            ### 📱 Installation
            Download the APK and enable **Install from Unknown Sources** in your Android settings.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
